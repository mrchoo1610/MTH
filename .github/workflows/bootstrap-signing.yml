# One-time setup, run manually: Actions -> "Bootstrap signing key & admin token" -> Run workflow.
# Creates the ECDSA signing key + hub admin token and stores them in GitHub so you never run scripts locally:
#   environment "release"    : secret SIGNING_KEY_PEM          (private key, used by release-app.yml)
#   environment "production" : secret HUB_ADMIN_TOKEN          (used by release-app.yml to upload)
#   repo variables           : HUB_PUBLIC_KEY_PEM, HUB_ADMIN_TOKEN_SHA256 (public values for the VPS .env)
#   commit                   : Shared/MiniTools.Updater/PublicKey.cs (public key compiled into the apps)
#
# Requires repo secret ADMIN_PAT: fine-grained PAT for mrchoo1610/MTH with
#   Secrets: Read and write, Variables: Read and write, Environments: Read and write, Administration: Read and write.
# GITHUB_TOKEN cannot write secrets, hence the PAT. Delete ADMIN_PAT afterwards if you like.
name: Bootstrap signing key & admin token

on:
  workflow_dispatch:
    inputs:
      rotate_signing_key:
        description: "Replace an EXISTING signing key. Apps already installed will NOT accept updates signed with the new key."
        type: boolean
        default: false
      rotate_admin_token:
        description: "Replace an existing admin token (update Hub__AdminTokenSha256 on the VPS afterwards)."
        type: boolean
        default: false

permissions:
  contents: write   # commit PublicKey.cs

concurrency:
  group: bootstrap-signing
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      GH_TOKEN: ${{ secrets.ADMIN_PAT }}
      REPO: ${{ github.repository }}
    steps:
      - name: Check PAT
        run: |
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::Repo secret ADMIN_PAT is missing (see the header of this workflow)."; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Create environments (idempotent)
        run: |
          set -euo pipefail
          for env in release production; do
            gh api -X PUT "repos/$REPO/environments/$env" --silent \
              || echo "::warning::Could not create environment '$env' (PAT needs Administration/Environments write). Create it in Settings -> Environments."
          done

      - name: What already exists
        id: existing
        run: |
          set -euo pipefail
          has_key=$(gh secret list --env release --repo "$REPO" --json name --jq '[.[].name] | index("SIGNING_KEY_PEM") != null')
          has_token=$(gh secret list --env production --repo "$REPO" --json name --jq '[.[].name] | index("HUB_ADMIN_TOKEN") != null')
          echo "has_key=$has_key" >> "$GITHUB_OUTPUT"
          echo "has_token=$has_token" >> "$GITHUB_OUTPUT"
          echo "signing key exists: $has_key, admin token exists: $has_token"

      - name: Build ManifestTool
        run: dotnet build scripts/tools/ManifestTool -c Release --nologo -v q

      - name: Signing key
        id: key
        if: steps.existing.outputs.has_key != 'true' || inputs.rotate_signing_key
        run: |
          set -euo pipefail
          umask 077
          KEY="$RUNNER_TEMP/signing-key.pem"
          PUB="$RUNNER_TEMP/public.pem"
          dotnet scripts/tools/ManifestTool/bin/Release/net10.0/ManifestTool.dll keygen --out "$KEY" --force > "$PUB"
          grep -q "BEGIN PUBLIC KEY" "$PUB" || { echo "::error::keygen did not print a public key"; exit 1; }
          gh secret set SIGNING_KEY_PEM --env release --repo "$REPO" < "$KEY"
          shred -u "$KEY" 2>/dev/null || rm -f "$KEY"
          # one line with literal \n separators (format expected by Hub__PublicKeyPem)
          ONELINE=$(python3 -c 'import sys; print(sys.stdin.read().replace("\r","").strip().replace("\n","\\n"))' < "$PUB")
          gh variable set HUB_PUBLIC_KEY_PEM --repo "$REPO" --body "$ONELINE"
          # PublicKey.cs (same format as scripts/new-signing-key.ps1)
          {
            echo 'namespace MiniTools.Updater;'
            echo ''
            echo '/// <summary>Public key used to verify release signatures. Generated by the bootstrap-signing workflow. Safe to commit.</summary>'
            echo 'public static class PublicKey'
            echo '{'
            echo '    public const string Pem = """'
            printf '%s\n' "$(tr -d '\r' < "$PUB")"   # keygen prints no trailing newline; closing """ must be on its own line
            echo '""";'
            echo '}'
          } > Shared/MiniTools.Updater/PublicKey.cs
          echo "rotated=true" >> "$GITHUB_OUTPUT"

      - name: Admin token
        if: steps.existing.outputs.has_token != 'true' || inputs.rotate_admin_token
        run: |
          set -euo pipefail
          OUT=$(dotnet scripts/tools/ManifestTool/bin/Release/net10.0/ManifestTool.dll token)
          TOKEN=$(echo "$OUT" | sed -n 's/^TOKEN=//p'); HASH=$(echo "$OUT" | sed -n 's/^SHA256=//p')
          if [ -z "$TOKEN" ] || [ -z "$HASH" ]; then echo "::error::token generation failed"; exit 1; fi
          echo "::add-mask::$TOKEN"
          printf '%s' "$TOKEN" | gh secret set HUB_ADMIN_TOKEN --env production --repo "$REPO"
          gh variable set HUB_ADMIN_TOKEN_SHA256 --repo "$REPO" --body "$HASH"

      - name: Commit PublicKey.cs
        if: steps.key.outputs.rotated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Shared/MiniTools.Updater/PublicKey.cs
          git diff --cached --quiet && { echo "PublicKey.cs unchanged"; exit 0; }
          git commit -m "Set release signing public key"
          git push origin HEAD:main

      - name: Summary (values for the VPS .env)
        env:
          GH_TOKEN: ${{ secrets.ADMIN_PAT }}
        run: |
          set -euo pipefail
          PUBKEY=$(gh variable get HUB_PUBLIC_KEY_PEM --repo "$REPO" 2>/dev/null || echo "<not set>")
          HASH=$(gh variable get HUB_ADMIN_TOKEN_SHA256 --repo "$REPO" 2>/dev/null || echo "<not set>")
          {
            echo "## Signing key & admin token"
            echo ""
            echo "- Private key: environment **release** → secret \`SIGNING_KEY_PEM\` (cannot be read back; there is no other copy)."
            echo "- Admin token: environment **production** → secret \`HUB_ADMIN_TOKEN\`."
            echo ""
            echo "### Put these two lines in \`/opt/minitools-hub/deploy/.env\` on the VPS"
            echo '```'
            echo "Hub__PublicKeyPem=$PUBKEY"
            echo "Hub__AdminTokenSha256=$HASH"
            echo '```'
            echo "Then re-run **Deploy hub**. Both values are public (not secrets)."
          } >> "$GITHUB_STEP_SUMMARY"
