# CI: build + test everything on every push / pull request.
# Runs only on GitHub-hosted runners (never on the self-hosted VPS runner).
name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore MiniTools.slnx

      - name: Build
        run: dotnet build MiniTools.slnx -c Release --no-restore

      - name: Test
        run: dotnet test MiniTools.slnx -c Release --no-build --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          retention-days: 7

  docker:
    name: Docker image builds (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build hub image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: MiniToolsHub/deploy/Dockerfile
          push: false
          tags: mth-hub:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
