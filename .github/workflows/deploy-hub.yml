# CD for the MiniToolsHub website/API.
# push to main (hub files changed) -> test -> build & push image to GHCR -> deploy on the VPS self-hosted runner.
name: Deploy hub

on:
  push:
    branches: [main]
    paths:
      - "MiniToolsHub/**"
      - "Shared/MiniTools.Contracts/**"
      - ".github/workflows/deploy-hub.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (default: this commit's sha). Use an older sha to roll back."
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-hub
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mth-hub

jobs:
  test:
    name: Test hub
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.image_tag == ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test Shared/tests/MiniTools.Contracts.Tests -c Release
      - run: dotnet test MiniToolsHub/tests/MiniToolsHub.Server.Tests -c Release

  image:
    name: Build & push image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (lowercase)
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: MiniToolsHub/deploy/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy on VPS
    needs: image
    # Runs even when 'image' was skipped (manual rollback with image_tag), but never after a failure.
    if: ${{ !failure() && !cancelled() }}
    runs-on: [self-hosted, linux, mth-hub]
    environment:
      name: production
      url: https://mth.mimehub.top
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_DIR: ${{ vars.HUB_DEPLOY_DIR || '/opt/minitools-hub/deploy' }}
      TAG: ${{ inputs.image_tag || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: MiniToolsHub/deploy

      - name: Sync compose file
        run: |
          set -euo pipefail
          mkdir -p "$DEPLOY_DIR/data"
          cp MiniToolsHub/deploy/docker-compose.yml "$DEPLOY_DIR/docker-compose.yml"
          test -f "$DEPLOY_DIR/.env" || { echo "::error::$DEPLOY_DIR/.env is missing (copy .env.example and fill it in)"; exit 1; }

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull & restart
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          export HUB_IMAGE="${IMAGE,,}:${TAG}"
          echo "Deploying $HUB_IMAGE"
          # /data must be writable by the container user (uid 1654 'app').
          if [ "$(stat -c %u data)" != "1654" ]; then
            docker run --rm -v "$PWD/data:/data" busybox:1.37 chown -R 1654:1654 /data
          fi
          docker compose pull hub
          docker compose up -d --no-build
          docker image prune -f >/dev/null

      - name: Health check
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          PORT=$(grep -E '^HUB_HOST_PORT=' .env | cut -d= -f2 || true); PORT=${PORT:-18473}
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${PORT}/healthz" >/dev/null; then echo "healthy"; exit 0; fi
            sleep 2
          done
          echo "::error::hub did not become healthy"
          docker compose logs --tail 100 hub
          exit 1

      - name: Logout
        if: always()
        run: docker logout ghcr.io || true
